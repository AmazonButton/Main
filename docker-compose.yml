version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_order_postgres
    restart: always
    environment:
      POSTGRES_USER: smartorder
      POSTGRES_PASSWORD: smartorder_secure_password_2026
      POSTGRES_DB: smart_order_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartorder -d smart_order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: smart_order_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://smartorder:smartorder_secure_password_2026@postgres:5432/smart_order_db?schema=public"
      JWT_SECRET: "smart_button_prod_super_secret_jwt_key_2026_9948"
      JWT_REFRESH_SECRET: "smart_button_prod_refresh_secret_key_2026_8832"
      DEVICE_DEFAULT_SECRET: "smart_order_device_master_secret_2026"
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: smart_order_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
